name: Validate Calendar Auth Diagnostic
on:
  push:
    branches: [hotfix/calendar-auth-diagnostic-20261023]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:mock
