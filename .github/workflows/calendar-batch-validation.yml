name: Validate Calendar EAC Batch
on:
  push:
    branches: [develop]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/eac-store-finance.test.mjs tests/eac-inscricao-modo-termos.static.test.mjs
      - run: npm run typecheck
      - run: npm run build
